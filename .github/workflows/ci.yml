name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      # 試すとき用。CI ごとに署名鍵が変わるので、上書きインストールはできない (配布は Releases を使う)。
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html

  e2e:
    name: E2E tests on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: cachix/install-nix-action@v31

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start fake mail server
        run: |
          nohup tools/fakemail/run.sh "$RUNNER_TEMP/fakemail" > "$RUNNER_TEMP/fakemail.log" 2>&1 &
          for i in $(seq 120); do
            (echo > /dev/tcp/127.0.0.1/1143) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/2525) 2>/dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/fakemail.log"
          exit 1

      - name: Run instrumented tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.fakemail=true

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            app/build/reports/androidTests/
            ${{ runner.temp }}/fakemail.log
            ${{ runner.temp }}/fakemail/dovecot.log
